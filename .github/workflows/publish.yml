name: Publish to TestPyPI

on:
  push:
    tags:
      - 'v*' # v1.0.0 같은 태그가 푸시될 때만 실행

jobs:
  publish:
    runs-on: ubuntu-latest
    
    # Trusted Publishing을 위한 핵심 권한 설정
    permissions:
      id-token: write  # OIDC 인증을 위해 반드시 필요
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 1. pip 업그레이드 및 파이썬 공식 빌드 도구(build) 설치
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      # 2. python -m build로 dist/ 폴더에 .whl 및 .tar.gz 생성
      - name: Build package
        run: python -m build

      # PyPI 공식 퍼블리시 액션을 사용해 TestPyPI로 업로드
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1 
        with:
          repository-url: https://test.pypi.org/legacy/
      
      # 4. GitHub Release에 .whl 및 .tar.gz 파일 첨부
      - name: Upload Release Assets (.whl, .tar.gz)
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
          generate_release_notes: true # 커밋 내역을 바탕으로 릴리즈 노트 자동 생성